packages:
  - 'packages/*'
allowBuilds:
  esbuild: true
  koffi: true
minimumReleaseAgeExclude:
  - '@huaqiu/dsh-artifacts@0.3.3'
  - '@huaqiu/dsh-auth@0.3.3'
  - '@hqedge/paths@0.1.2'

# dsh-jobs-local's public LocalJobRegistry types import dsh-session without
# declaring it as a peer, so TypeScript falls back to whichever copy pnpm hoisted
# and the branded SessionId stops matching the consumer's own SDK copy. Bind the
# missing peer to the consumer's SDK; keep this range on the pinned @deepseek-ai/dsh-*
# baseline and drop the entry once upstream declares the peer.
packageExtensions:
  '@deepseek-ai/dsh-jobs-local@>=0.2.1-rc.2':
    peerDependencies:
      '@deepseek-ai/dsh-session': '^0.2.1-rc.2'
