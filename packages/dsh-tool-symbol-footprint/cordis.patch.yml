# DSH bundle patch: inserts the Huaqiu symbol/footprint generation tool plugin.
# The entry inject must match the node-half module contract
# (`src/index.ts` — export const inject). The tool's apply() reads the
# `huaqiuAuth` and `huaqiuArtifacts` services and throws if they are absent,
# so the loader must hold this entry until those services are provided.
- insert:
    - id: huaqiu-tool-symbol-footprint
      name: '@huaqiu/dsh-tool-symbol-footprint'
      inject: ['tools', 'huaqiuAuth', 'huaqiuArtifacts']
