name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build      
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r pack --dry-run
      - name: Pre-publish integrity gate
        run: pnpm run check:publish
